<style>
.sg-payroll{max-width:1040px;margin:0 auto;color:var(--text-color,#334155)}
.sg-surface{background:var(--color-white,#fff);border:1px solid #e7ebf0;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 2px 8px rgba(15,23,42,.025)}
.sg-section-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.sg-section-heading h2,.sg-section-heading h3{font-size:16px;font-weight:650;line-height:1.4;margin:0;color:var(--dark-color,#172033)}
.sg-section-heading p,.sg-exemption-fields p{font-size:12px;color:#718096;margin:5px 0 0;line-height:1.6}.sg-status{font-size:11px;font-weight:600;padding:6px 10px;border-radius:20px;background:#f1f5f9;color:#475569;white-space:nowrap}.sg-status--ready{background:#ecfdf5;color:#047857}.sg-status--pending{background:#fff7ed;color:#b45309}
.sg-employment-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.sg-employment-summary dt,.sg-config label,.sg-details-form label{font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:6px}.sg-employment-summary dd{font-size:13px;font-weight:500;margin:0}.sg-text-button{font-size:12px;color:var(--primary-color,#2563eb);background:transparent;border:0;cursor:pointer;padding:5px 0;text-decoration:none}
.sg-config-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px}.sg-input,.sg-details-form input:not([type=hidden]),.sg-details-form select{width:100%;min-width:0;height:38px;border:1px solid #dce2ea;border-radius:8px;background:var(--color-white,#fff);padding:8px 11px;font-size:12px;color:inherit;box-sizing:border-box}.sg-input:focus,.sg-details-form input:focus,.sg-details-form select:focus{outline:2px solid #dbeafe;border-color:#93b4ed}
.sg-fund-heading,.sg-fund-row{display:grid;grid-template-columns:minmax(180px,.85fr) minmax(240px,1.15fr);gap:22px;align-items:start}.sg-fund-heading{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#94a3b8;padding:0 0 10px;border-bottom:1px solid #edf0f4}.sg-fund-row{padding:14px 0;border-bottom:1px solid #edf0f4}.sg-fund-label strong{display:block;font-size:13px;font-weight:650;margin:3px 0}.sg-fund-label small{font-size:11px;color:#94a3b8;line-height:1.4;display:block}.sg-fund-extra{display:flex;gap:12px;margin-top:0}.sg-fund-extra:has(>div:not([hidden])){margin-top:10px}.sg-fund-extra>div{flex:1;min-width:0}.sg-fund-extra>[data-shg-amount]{flex:0 0 135px}.sg-config [hidden]{display:none!important}
.sg-config-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:22px}.sg-config-footer .oh-btn{font-size:12px;min-height:36px;border-radius:8px}.sg-save-note{font-size:11px;color:#94a3b8;text-align:right;margin:9px 0 0}.sg-exemption-fields{padding:16px;background:#f8fafc;border-radius:9px;margin-top:16px}.sg-exemption-fields h4{font-size:12px;font-weight:600;margin:0 0 4px}.sg-exemption-fields .sg-config-meta{margin:14px 0 0}.sg-config .errorlist,.sg-details-form .errorlist{color:#b91c1c;font-size:12px;margin-top:5px}.sg-sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.sg-readiness-note{font-size:12px;color:#64748b;line-height:1.5;margin:0 0 14px}.sg-history-link{font-size:11px;text-align:right}.sg-details-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:15px}.sg-history-table{width:100%;font-size:12px}.sg-history-table td,.sg-history-table th{padding:10px;text-align:left;border-bottom:1px solid #edf0f4}
@media(max-width:700px){.sg-surface{padding:18px}.sg-fund-heading{display:none}.sg-fund-row{grid-template-columns:1fr;gap:10px}.sg-config-meta{grid-template-columns:1fr}.sg-employment-summary{grid-template-columns:1fr 1fr}.sg-section-heading{align-items:flex-start}.sg-fund-extra{flex-wrap:wrap}.sg-fund-extra>[data-shg-amount]{flex:1}.sg-save-note{text-align:left}}

.sg-start-month{margin-top:18px;color:#718096;font-size:13px}.sg-start-month>label{display:flex;align-items:center;gap:8px;font-weight:500}.sg-start-month input[type=checkbox]{width:16px;height:16px}.sg-start-month small{display:block;margin:4px 0 0 24px}.sg-start-month [data-start-month]{max-width:280px;margin-top:12px}.sg-start-month [data-start-month]>label{display:block;margin-bottom:6px}
</style>
