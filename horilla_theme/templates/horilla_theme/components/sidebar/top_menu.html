{% load i18n static neutron_ui %}
{% comment %}
  Dashboard (top-level icon, no submenu panel). The sidebar script swaps only
  the main content region on click; no hx-* attributes here, so one click
  sends one request.
{% endcomment %}
<a
    href="{% neutron_home_url %}"
    class="sideboxmain group flex items-center gap-3 px-3 py-2.5 rounded-lg w-full transition duration-300"
    data-menu="Dashboard"
>
    {% neutron_icon "dashboard" 18 %}
    <span
        class="oh-sidebar-label text-sm font-medium truncate flex-1 text-left"
        aria-hidden="true"
    >{% trans "Dashboard" %}</span>
</a>
