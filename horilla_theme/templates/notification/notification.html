{% load static i18n basefilters notifications_tags horillafilters neutron_ui %}
<div id="notificationPanel" class="dropdown-content neutron-notification-panel" role="dialog" aria-label="{% trans 'Notifications' %}">
    <div class="neutron-popover-header">
        <h2>{% trans "Notifications" %}</h2>
        <div class="flex gap-1">
            <button type="button" class="neutron-icon-button" hx-get="{% url 'notification-sound' %}" hx-swap="none"
                aria-label="{% trans 'Notification sound' %}" title="{% trans 'Notification sound' %}"
                aria-pressed="{{request.user.employee_get.notification_sound.sound_enabled|yesno:'true,false'}}"
                onclick="toggleNotificationIcon($(this))">
                <ion-icon name="{{request.user.employee_get.notification_sound.sound_enabled|yesno:'volume-high-outline,volume-mute-outline'}}" aria-hidden="true"></ion-icon>
            </button>
            <button type="button" class="neutron-icon-button" hx-get="{% url 'read-notifications' %}" hx-target="#notificationContainer"
                aria-label="{% trans 'Mark all as read' %}" title="{% trans 'Mark all as read' %}">{% neutron_icon "check_all" 17 %}</button>
            <button type="button" class="neutron-icon-button" data-neutron-popover-close
                aria-label="{% trans 'Close notifications' %}" title="{% trans 'Close notifications' %}">{% neutron_icon "close" 17 %}</button>
        </div>
    </div>
    <div id="notificationContainer">{% include "notification/notification_items.html" %}</div>
    <div class="neutron-popover-footer">
        <button type="button" class="oh-btn oh-btn--light toggleSidemenu" data-sidebar="sidebarModal3"
            hx-get="{% url 'all-notifications' %}" hx-target="#sidebarModalBody" data-neutron-popover-close>{% trans "View all" %}</button>
    </div>
</div>
<script src="{% static 'notifications/notify.js' %}" type="text/javascript"></script>

<script>
    var staticUrl = $("#statiUrl").attr("data-url");
    var notification_sound = {{request.user.employee_get.notification_sound.sound_enabled|yesno:"true,false"}};
    function fill_notification_badge(data) {
        var badges = document.getElementsByClassName(notify_badge_class);
        let previousUnreadCount = parseInt(localStorage.getItem('previousUnreadCount')) || 0;
        if (notification_sound) {
            if (
                previousUnreadCount !== null &&
                previousUnreadCount < data.unread_count
            ) {
                const audio = new Audio(
                    `${staticUrl}static/audio/notification-sound.wav`
                );
                audio.play();
            }
        }

        if (badges) {
            for (var i = 0; i < badges.length; i++) {
                badges[i].innerHTML = data.unread_count;
            }
        }
        localStorage.setItem('previousUnreadCount', data.unread_count);
    }
    function markAsRead(notificationId) {
        fetch("/notifications/mark-as-read/" + notificationId + "/").then(
            (response) => {
                if (response.ok) {
                    // Reload the page to update the notifications
                    location.reload();
                } else {
                    console.error("Failed to mark notification as read");
                }
            }
        );
    }

    $("#viewallnotification").click(function () {
        $("#showallnotificationbtn").toggle();
    });

    function toggleNotificationIcon($el) {
        notification_sound = $el.attr("aria-pressed") !== "true";
        $el.attr("aria-pressed", String(notification_sound));
        $el.find("ion-icon").attr("name", notification_sound ? "volume-high-outline" : "volume-mute-outline");
    }

    function markNotificationAndRedirect(element) {
        var notificationLink = $(element);
        var notificationId = notificationLink.data("id");

        $.ajax({
            type: "POST",
            url: "/mark-as-read-notification-json/",
            data: {
                csrfmiddlewaretoken: getCookie("csrftoken"),
                notification_id: notificationId,
            },
            success: function (response) {
                // Redirect in all cases
                window.location.href = notificationLink.attr("href");

                if (!response.success) {
                    console.error("Failed to mark notification as read");
                    if (response.error) {
                        console.error("Error:", response.error);
                    }
                }
            },
            error: function (xhr, status, error) {
                window.location.href = notificationLink.attr("href");
                console.error("Error:", status, error);
            },
        });
    }
</script>
{% register_notify_callbacks callbacks='fill_notification_list,fill_notification_badge' %}
