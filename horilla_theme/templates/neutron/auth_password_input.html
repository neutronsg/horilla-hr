{% load i18n %}<div class="neutron-auth__password">
    {% if field %}{{ field }}{% else %}<input type="password" id="{{ input_id }}" name="{{ input_name }}" required autocomplete="{{ autocomplete|default:'current-password' }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}>{% endif %}
    <button type="button" class="neutron-auth__reveal" aria-pressed="false" aria-label="{% trans 'Show password' %}" data-show="{% trans 'Show password' %}" data-hide="{% trans 'Hide password' %}">
        <svg class="when-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="when-shown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.1 3M6.6 6.6C3.6 8.6 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>
    </button>
</div>
