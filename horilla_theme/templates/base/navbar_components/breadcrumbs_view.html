{% load static i18n neutron_ui %}
<ul class="breadcrumb neutron-breadcrumb">
    {% for breadcrumb in breadcrumbs|breadcrumb_items %}
        <li>
            {% if breadcrumb.clickable and breadcrumb.found %}
                <a href="{{ breadcrumb.url }}">{{ breadcrumb.label }}</a>
            {% elif not breadcrumb.clickable %}
                <span>{{ breadcrumb.label }}</span>
            {% else %}
                <a href="#">{{ breadcrumb.label }}</a>
            {% endif %}
        </li>
    {% endfor %}
</ul>
